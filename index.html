<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Happy Birthday</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(#ffd6e7, #d9e8ff);
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.card {
    width: 500px;
    height: 350px;
    position: relative;
    perspective: 1200px;
}

.inside {
    position: absolute;
    width: 100%;
    height: 100%;
    background: white;
    border-radius: 20px;
    text-align: center;
    padding-top: 80px;
    box-sizing: border-box;
}

.inside h1 {
    color: hotpink;
    font-size: 42px;
}

.inside p {
    font-size: 22px;
}

.door {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
    background: #8b4513;
    border: 5px solid #5c2f0d;
    box-sizing: border-box;
    transition: transform 1.3s;
    z-index: 2;
}

.left {
    left: 0;
    transform-origin: left;
    border-radius: 20px 0 0 20px;
}

.right {
    right: 0;
    transform-origin: right;
    border-radius: 0 20px 20px 0;
}

.knob {
    position: absolute;
    top: 50%;
    width: 24px;
    height: 24px;
    background: gold;
    border-radius: 50%;
    transform: translateY(-50%);
}

.left .knob {
    right: 20px;
}

.right .knob {
    left: 20px;
}

.card.open .left {
    transform: rotateY(-105deg);
}

.card.open .right {
    transform: rotateY(105deg);
}

.balloon {
    position: absolute;
    font-size: 45px;
    bottom: -60px;
    animation: float 5s infinite;
}

.b1 { left: 50px; }
.b2 { left: 180px; animation-delay: 1s; }
.b3 { right: 80px; animation-delay: 2s; }

@keyframes float {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(-450px);
    }
}
</style>
</head>

<body>

<div class="card" onclick="openCard()" id="card">

    <div class="inside">

        <div class="balloon b1">🎈</div>
        <div class="balloon b2">🎈</div>
        <div class="balloon b3">🎈</div>

        <h1>🎂 Happy Birthday Beth! 🎂</h1>
        <p>Hope you have an amazing birthday!</p>

    </div>

    <div class="door left">
        <div class="knob"></div>
    </div>

    <div class="door right">
        <div class="knob"></div>
    </div>

</div>

<script>
function openCard() {
    document.getElementById("card").classList.add("open");
}
</script>

</body>
</html>
